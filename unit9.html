<script>
let n=0,stars=0,z={};const host=document.getElementById('pages');
function award(t){if(t.dataset.done!=='1'){t.dataset.done='1';stars++;document.getElementById('score').textContent='⭐ '+stars}}
function fb(t,m,ok){let f=t.querySelector('.feedback');if(f){f.textContent=m;f.className='feedback '+(ok?'good':'bad')}}
function task(s,h,b){let t=document.createElement('div');t.className='task';t.innerHTML='<h3>'+h+'</h3>'+b;s.appendChild(t);return t}
function check(t){let a=[...t.querySelectorAll('[data-answer]')],ok=a.length&&a.every(x=>(x.value||'').trim().toLowerCase()===x.dataset.answer.toLowerCase());fb(t,ok?'Excellent! All correct ⭐':'Try again. Check your answers.',ok);if(ok)award(t)}
function videoBox(m,src){let b=document.createElement('div');b.className='mediabox video-box';let q=document.createElement('button');q.className='watch';q.textContent='▶ WATCH VIDEO';let v=document.createElement('video');v.controls=true;v.preload='none';v.src=src;v.hidden=true;q.onclick=()=>{v.hidden=false;q.hidden=true;v.play().catch(()=>{})};b.append(q,v);m.appendChild(b)}
function clothes(s){task(s,'👕 Match the clothes','<p>Look at each picture and choose its name.</p><div class=grid>'+[['👕','T-shirt'],['👖','jeans'],['👗','dress'],['🧦','socks'],['🧥','jacket'],['👒','hat'],['🕶️','glasses'],['👜','handbag']].map(([e,w])=>'<label class=card><span class=emoji>'+e+'</span><select data-answer="'+w+'"><option value="">Choose</option>'+['T-shirt','jeans','dress','socks','jacket','hat','glasses','handbag'].map(x=>'<option>'+x+'</option>').join('')+'</select></label>').join('')+'</div><button onclick="check(this.closest(\'.task\'))">Check</button><div class=feedback></div>')}
function odd(s){let rows=[{w:['apple','dress','T-shirt','jeans'],a:'apple'},{w:['socks','banana','hat','cap'],a:'banana'},{w:['car','shirt','trousers','jacket'],a:'car'},{w:['sunglasses','lion','handbag','glasses'],a:'lion'},{w:['shorts','pizza','skirt','shoes'],a:'pizza'}];let b=rows.map((r,i)=>'<div class=row><b>'+(i+1)+'.</b> '+r.w.map(w=>'<label class=wordpick><input type=radio name=o'+i+' value="'+w+'"> '+w+'</label>').join(' ')+'</div>').join('');task(s,'🕵️ Find the odd word','<p>Choose one word that does not belong in each row.</p>'+b+'<button onclick="checkOdd(this)">Check answers</button><div class=feedback></div>')}
function checkOdd(btn){let t=btn.closest('.task'),a=['apple','banana','car','lion','pizza'],ok=a.every((x,i)=>t.querySelector('input[name=o'+i+']:checked')?.value===x);fb(t,ok?'Excellent detective work! ⭐':'Check each group again.',ok);if(ok)award(t)}
function present(s){let q=[['👗','She ___ wearing a red dress.','is'],['👖','He ___ wearing jeans.','is'],['👕','I ___ wearing a T-shirt.','am'],['🧦','They ___ wearing socks.','are'],['🧥','We ___ wearing jackets.','are']];task(s,'🧍 What are they wearing?','<p>Choose <b>am / is / are</b> in the middle of each sentence.</p>'+q.map(([e,x,a])=>'<div class=row><span class=emoji>'+e+'</span>'+x.replace('___','<select data-answer="'+a+'"><option value="">?</option><option>am</option><option>is</option><option>are</option></select>')+'</div>').join('')+'<button onclick="check(this.closest(\'.task\'))">Check</button><div class=feedback></div>')}
function cipher(s){
let words=['wearing','a','purple','dress','blue','jeans','red','T-shirt','green','skirt','has','got','eating'];
let accepted=['wearing a purple dress','wearing blue jeans','wearing a red T-shirt','wearing a green skirt'];
let tiles=words.slice().sort(()=>Math.random()-.5).map((w,i)=>'<button type=button class=tile draggable=true data-word="'+w+'" ondragstart="sentenceDrag(event)" onclick="sentenceTap(this)">'+w+'</button>').join('');
task(s,'👕 Make a sentence about yourself','<p>Start with <b>I am</b>. Drag the words into the sentence to say what you are wearing. You can also tap a word and then tap the sentence line.</p><div class=sentence-builder><div class=sentence-line><b>I am</b><div id=sentenceDrop class=sentence-drop ondragover="event.preventDefault()" ondrop="sentenceDrop(event,this)" onclick="sentencePlaceSelected(this)"><span class=drop-hint>Drop words here</span></div></div><div class=drag-bank>'+tiles+'</div><div class=small>Try: wearing a purple dress / wearing blue jeans / wearing a red T-shirt / wearing a green skirt.</div><button type=button onclick="checkSentence(this)">Check my sentence</button><button type=button onclick="resetSentence(this)">Start again</button><div class=feedback></div></div>')
}
let sentenceSelected=null;
function sentenceTap(el){sentenceSelected=el;document.querySelectorAll('.sentence-builder .tile').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}
function sentencePlaceSelected(drop){if(!sentenceSelected)return;drop.querySelector('.drop-hint')?.remove();let copy=sentenceSelected.cloneNode(true);copy.draggable=false;copy.onclick=null;copy.classList.remove('selected');copy.classList.add('placed-word');drop.appendChild(copy);sentenceSelected.remove();sentenceSelected=null}
function sentenceDrag(e){e.dataTransfer.setData('text/plain',e.currentTarget.dataset.word)}
function sentenceDrop(e,drop){e.preventDefault();let word=e.dataTransfer.getData('text/plain');let taskEl=drop.closest('.task');let tile=[...taskEl.querySelectorAll('.drag-bank .tile')].find(x=>x.dataset.word===word);if(tile){drop.querySelector('.drop-hint')?.remove();let copy=tile.cloneNode(true);copy.draggable=false;copy.onclick=null;copy.classList.remove('selected');copy.classList.add('placed-word');drop.appendChild(copy);tile.remove()}}
function checkSentence(btn){let t=btn.closest('.task');let words=[...t.querySelectorAll('.sentence-drop .placed-word')].map(x=>x.dataset.word);let sentence=words.join(' ').toLowerCase();let ok=accepted.includes(sentence);fb(t,ok?'Lovely sentence! ⭐ “I am '+sentence+'.”':'Try to make one complete sentence. Check the word order and choose a matching set.',ok);if(ok)award(t)}
function resetSentence(btn){let t=btn.closest('.task');let drop=t.querySelector('.sentence-drop'),bank=t.querySelector('.drag-bank');let all=[...drop.querySelectorAll('.placed-word')].map(x=>x.dataset.word);drop.innerHTML='<span class=drop-hint>Drop words here</span>';let existing=[...bank.querySelectorAll('.tile')].map(x=>x.dataset.word);let allWords=[...existing,...all];bank.innerHTML=allWords.map(w=>'<button type=button class=tile draggable=true data-word="'+w+'" ondragstart="sentenceDrag(event)" onclick="sentenceTap(this)">'+w+'</button>').join('');let f=t.querySelector('.feedback');if(f)f.textContent=''}
function checkTask(btn){check(btn.closest('.task'))}
function characters(s){let p=[['👧','Nina','purple dress','💜'],['👦','Ben','blue jeans','💙'],['👧','Lucy','pink T-shirt','🌸'],['👦','Tom','green jacket','💚'],['👧','Mia','yellow skirt','💛']];let cards='<div class=character-board>'+p.map(([e,n,o,c])=>'<div class=character-card><div class=character-avatar>'+e+'</div><b>'+n+'</b><div class=outfit-chip>'+c+' '+o+'</div></div>').join('')+'</div>';let qs=p.map(([e,n,o])=>'<div class=match-person><b>'+e+' '+o+'</b><select data-answer="'+n+'"><option value="">Who is it?</option>'+['Mia','Tom','Nina','Lucy','Ben'].map(x=>'<option>'+x+'</option>').join('')+'</select></div>').join('');task(s,'🧍 Match the characters','<p>Look at the five characters. Read the clothes and choose the correct name.</p>'+cards+qs+'<button onclick="checkTask(this)">Check matching</button><div class=feedback></div>')}function havegot(s){let q=[['👜','I ___ got a blue bag.','have'],['👗','She ___ got a yellow dress.','has'],['👓','He ___ got black glasses.','has'],['👖','They ___ got blue jeans.','have']];task(s,'🎒 Have got / Has got','<p>Choose the missing word in the middle of each sentence.</p>'+q.map(([e,x,a])=>'<div class=row><span class=emoji>'+e+'</span>'+x.replace('___','<select data-answer="'+a+'"><option value="">?</option><option>have</option><option>has</option></select>')+'</div>').join('')+'<button onclick="check(this.closest(\'.task\'))">Check</button><div class=feedback></div>');let w=[['👜','I have got a blue bag.'],['👗','She has got a yellow dress.'],['👓','He has got black glasses.']];task(s,'🧩 Build the sentences','<p>Tap the word cards in the correct order to build each sentence.</p>'+w.map(([e,a])=>'<div class=row><span class=emoji>'+e+'</span><input class=wide data-answer="'+a+'" placeholder="Build your sentence"><div class=wordtiles>'+a.split(' ').sort().map(x=>'<button type=button class=tile onclick="let i=this.parentElement.parentElement.querySelector(\'input\');i.value+=(i.value?\' \' : \'\')+\''+x+'\'">'+x+'</button>').join('')+'</div></div>').join('')+'<button onclick="check(this.closest(\'.task\'))">Check sentences</button><div class=feedback></div>')}
function writeabout(s){task(s,'✍️ Write about the children','<p>Look at the children and the picture clues on the page above. Write one sentence with <b>I’ve got…</b> for each child.</p>'+['👦','👧','👦','👧'].map((e,i)=>'<div class=writingrow><span class=emoji>'+e+'</span><b>Child '+(i+1)+'</b><input class=wideinput placeholder="I’ve got …"></div>').join('')+'<p class=small>Your teacher can review your sentences.</p>')}
function song(s){let q=[['🏡','I’ve got a big ___','garden',['garden','pencil','hat']],['🏠','I’ve got a big ___','house',['house','shirt','shoe']],['🐭','I’ve got a small toy ___','mouse',['mouse','car','jacket']],['🎭','I’ve got a black ___','mask',['mask','dress','bag']],['🚙','I’ve got a big blue ___','car',['car','hat','sock']],['💜','I’ve got ___ hair','purple',['purple','green','yellow']]];task(s,'🎵 Song words','<p>Listen and complete the missing words.</p>'+q.map(([e,x,a,o])=>'<div class=row><span class=emoji>'+e+'</span>'+x.replace('___','<select data-answer="'+a+'"><option value="">Choose</option>'+o.map(w=>'<option>'+w+'</option>').join('')+'</select>')+'</div>').join('')+'<button onclick="check(this.closest(\'.task\'))">Check</button><div class=feedback></div>')}
function unscramble(s){let q=[['👗','s r e s d','dress'],['👖','s n j a e','jeans'],['🩳','s r t s h o','shorts'],['👓','s s s l e g a','glasses'],['👜','b g h d a a n','handbag']];task(s,'🔤 Unscramble the clothes','<p>Look at the picture, rearrange the letters and type the word.</p><div class=grid>'+q.map(([e,l,a])=>'<label class=card><span class=emoji>'+e+'</span><div><b>'+l+'</b><br><input data-answer="'+a+'" placeholder="Your answer"></div></label>').join('')+'</div><button onclick="check(this.closest(\'.task\'))">Check words</button><div class=feedback></div>')}
function categories(s){let d=[['jacket','clothes'],['juice','food'],['jeans','clothes'],['apple','fruit'],['banana','fruit'],['pencil','classroom'],['book','classroom'],['desk','classroom'],['bedroom','rooms'],['kitchen','rooms'],['shirt','clothes'],['bread','food'],['orange','fruit'],['bathroom','rooms'],['ruler','classroom'],['socks','clothes']];let c=['food','fruit','classroom','rooms','clothes'];let bank='<div class=drag-bank>'+d.map(([w,a])=>'<div class=drag-word draggable=true data-word="'+w+'" data-category="'+a+'" onclick="pickWord(this)" ondragstart="dragWord(event)">'+w+'</div>').join('')+'</div>';let bins='<div class=category-board>'+c.map(x=>'<div class=category-bin data-bin="'+x+'" ondragover="event.preventDefault();this.classList.add(&quot;over&quot;)" ondragleave="this.classList.remove(&quot;over&quot;)" ondrop="dropWord(event,this)" onclick="putSelected(this)"><h4>'+x.toUpperCase()+'</h4></div>').join('')+'</div>';task(s,'🧺 Drag the words into the correct boxes','<p>Drag each word into one of the five category boxes. On a touch screen, tap a word and then tap its category.</p>'+bank+bins+'<button onclick="checkCategories(this)">Check sorting</button><div class=feedback></div>')}
let selectedWord=null;function pickWord(el){document.querySelectorAll('.drag-word').forEach(x=>x.classList.remove('selected'));selectedWord=el;el.classList.add('selected')}function putSelected(bin){if(!selectedWord||!bin.classList.contains('category-bin'))return;bin.appendChild(selectedWord);selectedWord.classList.remove('selected');selectedWord=null}function dragWord(e){e.dataTransfer.setData('text/plain',e.currentTarget.dataset.word)}function dropWord(e,bin){e.preventDefault();bin.classList.remove('over');let w=e.dataTransfer.getData('text/plain'),t=bin.closest('.task'),el=t.querySelector('.drag-word[data-word="'+w+'"]');if(el)bin.appendChild(el)}function checkCategories(btn){let t=btn.closest('.task'),bins=[...t.querySelectorAll('.category-bin')],ok=bins.every(b=>[...b.querySelectorAll('.drag-word')].every(w=>w.dataset.category===b.dataset.bin))&&t.querySelectorAll('.drag-bank .drag-word').length===0;fb(t,ok?'Perfect sorting! ⭐':'Some words are still in the wrong box. Check the categories.',ok);if(ok)award(t)}
function reading(s){task(s,'📖 Read and choose','<p>Tom has got a blue jacket and black jeans. He is wearing a red T-shirt today. He has got a green bag, too. His sister has got a yellow dress and pink shoes.</p><div class=grid><div class=card><span class=emoji>👦</span><b>Tom</b></div><div class=card><span class=emoji>👧</span><b>His sister</b></div></div>'+[['What has Tom got?',['A green bag','A yellow dress','Pink shoes'],'A green bag'],['What is Tom wearing today?',['A red T-shirt','A blue jacket','A yellow dress'],'A red T-shirt'],['What has his sister got?',['Black jeans','Pink shoes','A green bag'],'Pink shoes']].map(([q,o,a])=>'<p><b>'+q+'</b></p><select data-answer="'+a+'"><option value="">Choose</option>'+o.map(x=>'<option>'+x+'</option>').join('')+'</select>').join('')+'<button onclick="check(this.closest(\'.task\'))">Check</button><div class=feedback></div>')}
function story(s){task(s,'📖 Story check','<p>Choose the correct answer.</p>'+[['Who is wearing a long white jacket and glasses?',['Marie Mouse','Monty','Trevor'],'Marie Mouse'],['Who is wearing blue trousers, a blue shirt and a blue hat?',['Maskman','Monty','Trollman'],'Monty'],['What is Monty eating?',['A sandwich','A pencil','An apple'],'A pencil']].map(([q,o,a])=>'<p>'+q+'</p><select data-answer="'+a+'"><option value="">Choose</option>'+o.map(x=>'<option>'+x+'</option>').join('')+'</select>').join('')+'<button onclick="check(this.closest(\'.task\'))">Check</button><div class=feedback></div>')}
P.forEach((p,i)=>{let s=document.createElement('section');s.className='slide';s.innerHTML='<h2>'+p.title+'</h2><div class=pagewrap><img class=pageimg id=im'+i+' src="'+p.image+'"><div class=zoom><button onclick="zoom('+i+',-.1)">−</button><button onclick="zoom('+i+',.1)">＋</button><button onclick="reset('+i+')">↺</button></div></div><div class=media id=media'+i+'></div>';host.appendChild(s);let m=s.querySelector('#media'+i);p.audios.forEach(a=>{let b=document.createElement('div');b.className='mediabox';b.innerHTML='<b>🎧 '+a.name+'</b>';let au=document.createElement('audio');au.controls=true;au.preload='none';au.src=a.src;b.appendChild(au);m.appendChild(b)});if(p.video)videoBox(m,p.video);if(i===0)clothes(s);if(i===1)odd(s);if(i===2){present(s);characters(s);}if(i===3)cipher(s);if(i===4)havegot(s);if(i===5)writeabout(s);if(i===6)song(s);if(i===7)unscramble(s);if(i===8)categories(s);if(i===9)reading(s);if(i===10)story(s)});
function zoom(i,d){let im=document.getElementById('im'+i),w=parseFloat(im.dataset.zoomWidth||'85');w=Math.max(55,Math.min(100,w+d*100));im.dataset.zoomWidth=w;im.style.width=w+'%'}function reset(i){let im=document.getElementById('im'+i);im.dataset.zoomWidth='85';im.style.width='85%'}
const S=[...document.querySelectorAll('.slide')];function update(){document.getElementById('count').textContent=(n+1)+' / '+S.length;document.getElementById('prev').disabled=n===0;document.getElementById('next').disabled=n===S.length-1;document.getElementById('bar').style.width=(n+1)/S.length*100+'%';if(n===S.length-1)document.getElementById('final').textContent='You earned '+stars+' stars!'}function startLesson(){move(1)}
function move(d){S[n].classList.remove('active');n=Math.max(0,Math.min(S.length-1,n+d));S[n].classList.add('active');update()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1)});document.getElementById('links').innerHTML=L.map(([e,t,u])=>'<a class=link href="'+u+'" target=_blank rel=noopener>'+e+' '+t+'<div class=small>Open Wordwall game ↗</div></a>').join('');update();
</script></body></html>
