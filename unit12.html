<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids Box 2 · Unit 12 · On Holiday!</title>
<style>
:root{--ink:#263451;--pink:#ff6f9f;--yellow:#ffd95b;--mint:#9be9d0;--blue:#9cddff;--purple:#c8b6ff}
*{box-sizing:border-box}body{margin:0;font-family:"Trebuchet MS",Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 8% 12%,#fff16d 0 4%,transparent 13%),radial-gradient(circle at 92% 8%,#ff91c8 0 4%,transparent 14%),radial-gradient(circle at 85% 75%,#76e7d0 0 5%,transparent 18%),linear-gradient(135deg,#ffe86b,#ffb5d4 38%,#9de7ff 70%,#b9f4bd);min-height:100vh}
header{padding:15px 4vw;background:#ffffffd9;position:sticky;top:0;z-index:10;box-shadow:0 4px 15px #33415516;backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand h1{font-size:clamp(18px,3vw,27px);margin:0;color:#e64f87}.brand p{margin:3px 0;font-size:13px}
.progress-wrap{height:8px;background:#e6eaf1;border-radius:99px;margin-top:12px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,#ff8db4,#ffd95b,#79d9c0);transition:width .25s}
main{max-width:1250px;margin:auto;padding:20px 18px 50px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.pill{background:white;padding:8px 13px;border-radius:99px;font-weight:800;box-shadow:0 3px 0 #dce2eb}.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.card{background:#ffffffeb;border:3px solid white;border-radius:24px;padding:clamp(14px,3vw,25px);box-shadow:0 10px 25px #45556a18}
h2{margin:0 0 6px;font-size:clamp(24px,4vw,34px)}.sub{margin:0 0 16px;color:#6b7890;font-weight:700}
.pageframe{overflow:auto;max-height:76vh;text-align:center;border-radius:16px;background:#f5f7fa;padding:10px}.pageimg{display:block;width:100%;height:auto;max-width:100%;margin:auto;transition:width .2s}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.btn,button{border:0;border-radius:13px;background:var(--yellow);color:#27344e;padding:10px 15px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 #e6b92f}.btn.secondary,button.secondary{background:#e7f1ff;box-shadow:0 3px 0 #c8d9ee}.btn.pink{background:#ffb6d0;box-shadow:0 3px 0 #e78dab}
.media-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}.mediacard{background:#fff7d8;border:2px solid white;border-radius:18px;padding:13px}.mediacard h3{margin:0 0 8px;font-size:16px}.mediacard audio,.mediacard video{width:100%;max-width:100%}
.intro{text-align:center;padding:clamp(25px,7vw,75px);background:radial-gradient(circle at 15% 20%,#fff 0 5%,transparent 15%),radial-gradient(circle at 80% 25%,#fff 0 4%,transparent 15%),linear-gradient(135deg,#fff0b7,#ffdce9,#d9f5ff);border-radius:28px;border:4px solid white;box-shadow:0 12px 28px #33415518}
.balloons{font-size:clamp(32px,6vw,64px);letter-spacing:8px}.intro h2{font-size:clamp(40px,8vw,78px);color:#ec5a91;text-shadow:3px 3px white;margin:10px}.intro p{font-size:clamp(17px,2.5vw,23px);font-weight:700;max-width:750px;margin:10px auto 25px;line-height:1.5}.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:20px}.chips span{background:white;padding:10px 14px;border-radius:99px;font-weight:800}
.activity{margin-top:16px;background:linear-gradient(135deg,#dffff1,#fff0a8 48%,#ffe0f0);border:3px solid white;border-radius:22px;padding:18px}.activity h3{margin:0 0 8px}.activity-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.task{background:white;border:2px solid #e5ebf5;border-radius:16px;padding:14px}.task input,.task select,.task textarea{width:100%;padding:10px;border:2px solid #d8e2ef;border-radius:10px;margin:6px 0 10px;font:inherit}.feedback{font-weight:800;margin-top:9px;min-height:22px}.ok{color:#16865e}.bad{color:#c94a68}
.wordgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.wordcard{text-align:center;background:#fff;border:2px solid #e7eaf2;border-radius:15px;padding:12px}.emoji{font-size:40px}.wordcard input{margin:8px 0}.wordcard button{width:100%}
.pronoun-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:center;margin:8px 0}.table-scroll{overflow:auto}.edit-table{border-collapse:collapse;width:100%;min-width:500px}.edit-table td,.edit-table th{border:2px solid #dce4ee;padding:7px}.edit-table input{margin:0;min-width:90px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px}.linkcard{display:block;text-decoration:none;color:var(--ink);background:white;border:3px solid white;border-radius:22px;padding:20px;box-shadow:0 6px 0 #dce2eb}.linkcard .emoji{font-size:45px}.linkcard h3{margin:8px 0}.linkcard span{color:#d94c83;font-weight:900}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.nav button{flex:1}
footer{text-align:center;color:#778197;padding:15px;font-size:12px}
@media(max-width:650px){main{padding:12px 10px 30px}.pageframe{max-height:68vh}.nav button{padding:10px 8px}.pronoun-row{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="brand"><div style="font-size:32px">🏖️</div><div><h1>Kids Box 2 · Unit 12: On Holiday!</h1><p>Listen · Learn · Play · Collect stars ⭐</p></div><div style="margin-left:auto" class="pill">⭐ <span id="stars">0</span> stars</div></div><div class="progress-wrap"><div class="progress" id="progress"></div></div></header>
<main><div class="topline"><div class="pill" id="counter">Welcome!</div><div class="pill">Completed activities: <span id="completed">0</span></div></div>
<section id="slide" class="card" style="margin-top:14px"></section>
<div class="nav"><button class="secondary" onclick="prev()">← Previous</button><button onclick="next()">Next →</button></div></main><footer>One standalone HTML lesson · All provided media embedded</footer>
<script>
const pages=[{"title": "Pupils Book · Page 84", "subtitle": "Unit 12 · On Holiday! · Pupils Book", "page": 84, "book": "Pupils Book", "img": "media/unit12/img01.jpg", "audios": [{"name": "Track 114", "src": "media/unit12/audio01.mp3"}, {"name": "Track 115", "src": "media/unit12/audio02.mp3"}], "video": null}, {"title": "Activity Book · Page 84", "subtitle": "Unit 12 · On Holiday! · Activity Book", "page": 84, "book": "Activity Book", "img": "media/unit12/img02.jpg", "audios": [{"name": "Track 37", "src": "media/unit12/audio03.mp3"}], "video": null}, {"title": "Pupils Book · Page 85", "subtitle": "Unit 12 · On Holiday! · Pupils Book", "page": 85, "book": "Pupils Book", "img": "media/unit12/img03.jpg", "audios": [{"name": "Track 116", "src": "media/unit12/audio04.mp3"}, {"name": "Track 117", "src": "media/unit12/audio05.mp3"}], "video": "media/unit12/video01.mp4"}, {"title": "Activity Book · Page 85", "subtitle": "Unit 12 · On Holiday! · Activity Book", "page": 85, "book": "Activity Book", "img": "media/unit12/img04.jpg", "audios": [], "video": null}, {"title": "Pupils Book · Page 86", "subtitle": "Unit 12 · On Holiday! · Pupils Book", "page": 86, "book": "Pupils Book", "img": "media/unit12/img05.jpg", "audios": [{"name": "Track 118", "src": "media/unit12/audio06.mp3"}], "video": "media/unit12/video02.mp4"}, {"title": "Activity Book · Page 86", "subtitle": "Unit 12 · On Holiday! · Activity Book", "page": 86, "book": "Activity Book", "img": "media/unit12/img06.jpg", "audios": [{"name": "Track 38", "src": "media/unit12/audio07.mp3"}], "video": null}, {"title": "Pupils Book · Page 87", "subtitle": "Unit 12 · On Holiday! · Pupils Book", "page": 87, "book": "Pupils Book", "img": "media/unit12/img07.jpg", "audios": [{"name": "Track 119", "src": "media/unit12/audio08.mp3"}, {"name": "Track 120", "src": "media/unit12/audio09.mp3"}], "video": null}, {"title": "Activity Book · Page 87", "subtitle": "Unit 12 · On Holiday! · Activity Book", "page": 87, "book": "Activity Book", "img": "media/unit12/img08.jpg", "audios": [{"name": "Track 39", "src": "media/unit12/audio10.mp3"}], "video": null}, {"title": "Pupils Book · Page 88", "subtitle": "Unit 12 · On Holiday! · Pupils Book", "page": 88, "book": "Pupils Book", "img": "media/unit12/img09.jpg", "audios": [{"name": "Track 121", "src": "media/unit12/audio11.mp3"}], "video": "media/unit12/video03.mp4"}, {"title": "Activity Book · Page 88", "subtitle": "Unit 12 · On Holiday! · Activity Book", "page": 88, "book": "Activity Book", "img": "media/unit12/img10.jpg", "audios": [], "video": null}, {"title":"Pupils Book \u00b7 Page 89","subtitle":"Unit 12 \u00b7 On Holiday! \u00b7 Pupils Book","page":89,"book":"Pupils Book","img":"media/unit12/img11.jpg","audios":[{"name":"Track 122","src":"media/unit12/audio12.mp3"},{"name":"Track 123","src":"media/unit12/audio13.mp3"}],"video":"media/unit12/video04.mp4"},{"title": "Pupils Book · Page 90", "subtitle": "Unit 12 · On Holiday! · Pupils Book", "page": 90, "book": "Pupils Book", "img": "media/unit12/img12.jpg", "audios": [{"name": "Track 124", "src": "media/unit12/audio14.mp3"}], "video": "media/unit12/video05.mp4"}, {"title": "Activity Book · Page 90", "subtitle": "Unit 12 · On Holiday! · Activity Book", "page": 90, "book": "Activity Book", "img": "media/unit12/img13.jpg", "audios": [{"name": "Track 40", "src": "media/unit12/audio15.mp3"}], "video": null}, {"title": "Pupils Book · Page 91", "subtitle": "Unit 12 · On Holiday! · Pupils Book", "page": 91, "book": "Pupils Book", "img": "media/unit12/img14.jpg", "audios": [{"name": "Track 125", "src": "media/unit12/audio16.mp3"}], "video": null}, {"title": "Activity Book · Page 91", "subtitle": "Unit 12 · On Holiday! · Activity Book", "page": 91, "book": "Activity Book", "img": "media/unit12/img15.jpg", "audios": [{"name": "Track 41", "src": "media/unit12/audio17.mp3"}], "video": null}];
const wordwall=[["Holiday Wordwall 1", "https://wordwall.net/ru/resource/15008889/kids-box-2-unit-12", "🏖️"], ["Holiday Wordwall 2", "https://wordwall.net/ru/resource/3610369/kids-box-2-unit-12", "🧳"], ["On Holiday", "https://wordwall.net/ru/resource/24440579/kids-box-2/kids-box-2-unit-12-on-holiday", "🎒"]];
let index=0,zoom=100,stars=0,completed=new Set();
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function award(key,txt){if(!completed.has(key)){completed.add(key);stars++;$('stars').textContent=stars;$('completed').textContent=completed.size;}return txt}
function feedback(id,ok,yes,no){let el=$(id);if(!el)return;el.className='feedback '+(ok?'ok':'bad');el.textContent=ok?yes:no}
function render(){
 $('progress').style.width=((index+1)/(pages.length+2)*100)+'%';
 $('counter').textContent=index===0?'Introduction':index===pages.length+1?'Bonus games':`${index} / ${pages.length} · ${pages[index-1]?.title||''}`;
 const root=$('slide');
 if(index===0){root.innerHTML=`<div class="intro"><div class="balloons">🎈 🧳 🌴 🏖️ 🎒</div><div style="font-weight:1000;letter-spacing:3px;color:#159c9c">KIDS BOX 2 · UNIT 12</div><h2>On Holiday!</h2><p>Let’s explore places, talk about holidays, listen to stories and songs, and practise English with games.</p><div class="chips"><span>🗺️ Travel words</span><span>🎧 Listen & sing</span><span>🧩 Interactive tasks</span><span>⭐ Earn stars</span></div><button onclick="next()">Let’s start! 🚀</button></div>`;return}
 if(index===pages.length+1){root.innerHTML=`<h2>🎯 Holiday Bonus Games!</h2><p class="sub">Three Wordwall games to finish Unit 12.</p><div class="links">${wordwall.map(([name,url,emoji])=>`<a class="linkcard" href="${url}" target="_blank" rel="noopener"><div class="emoji">${emoji}</div><h3>${name}</h3><span>Open Wordwall ↗</span></a>`).join('')}</div>`;return}
 const p=pages[index-1];
 root.innerHTML=`<h2>${p.title}</h2><p class="sub">${p.subtitle}</p><div class="controls"><button onclick="zoomBy(15)">＋ Zoom</button><button class="secondary" onclick="zoomBy(-15)">− Zoom</button><button class="secondary" onclick="zoomReset()">Fit page</button></div><div class="pageframe"><img id="pageimg" class="pageimg" src="${p.img}" alt="${p.title}"></div><div class="media-grid" id="media"></div>${activityFor(p)}`;
 $('pageimg').style.width=zoom+'%';
 const media=$('media');
 p.audios.forEach(a=>{let d=document.createElement('div');d.className='mediacard';d.innerHTML=`<h3>🎧 ${esc(a.name)}</h3><audio controls preload="none" src="${a.src}"></audio>`;media.appendChild(d)});
 if(p.video){let d=document.createElement('div');d.className='mediacard';d.innerHTML=`<h3>▶️ Video</h3><video controls preload="metadata" playsinline src="${p.video}"></video>`;media.appendChild(d)}
}
function zoomBy(n){zoom=Math.max(50,Math.min(220,zoom+n));if($('pageimg'))$('pageimg').style.width=zoom+'%'}
function zoomReset(){zoom=100;if($('pageimg'))$('pageimg').style.width='100%'}
function next(){index=Math.min(pages.length+1,index+1);render()}
function prev(){index=Math.max(0,index-1);render()}
function activityFor(p){
 const pg=p.page,book=p.book;
 if(book==='Pupils Book'&&pg===84)return `<div class="activity"><h3>🏖️ Unscramble the holiday words</h3><p>Look at each picture, then type the word using the mixed-up letters.</p><div class="wordgrid">${[['🏔️','mountain','n u o t n a i m'],['☀️','sun','n u s'],['🐚','shell','l h e l s'],['🏖️','sand','d a n s'],['🌊','sea','a e s'],['🏝️','beach','h a c e b']].map(([e,w,l],i)=>`<div class="wordcard"><div class="emoji">${e}</div><b>${l}</b><input id="pb84${i}" placeholder="Write the word"><button onclick="let ok=$('pb84${i}').value.trim().toLowerCase()==='${w}';feedback('pb84fb${i}',ok,award('pb84${i}','⭐ Correct!'),'Try the letters again.')">Check</button><div id="pb84fb${i}" class="feedback"></div></div>`).join('')}</div></div>`;
 if(book==='Activity Book'&&pg===84)return `<div class="activity"><h3>🔎 Holiday word hunt</h3><p>Listen to Track 37, then find the holiday words in the letter grid. Type each word you find. The matching task stays below.</p><div class="task"><div style="display:grid;grid-template-columns:repeat(8,minmax(24px,1fr));gap:4px;max-width:560px;margin:0 auto 14px">${'M O U N T A I N S U N X S H E L L S A N D X S E A X B E A C H X'.split(' ').map(l=>`<span style="background:#fff;border:2px solid #d9e8ff;border-radius:8px;padding:7px 2px;font-weight:900;text-align:center">${l}</span>`).join('')}</div><div class="activity-grid">${['mountain','sun','shell','sand','sea','beach'].map((w,i)=>`<div class="task"><label>Find: <b>${w}</b></label><input id="ab84hunt${i}" placeholder="Type the word"><button onclick="let ok=$('ab84hunt${i}').value.trim().toLowerCase()==='${w}';feedback('ab84huntfb${i}',ok,award('ab84hunt${i}','Found!'),'Look carefully in the grid.')">Check</button><div id="ab84huntfb${i}" class="feedback"></div></div>`).join('')}</div></div><h3 style="margin-top:18px">✏️ Matching and spelling practice</h3><div class="activity-grid">${[['holiday','A time away from home'],['suitcase','A bag for a trip'],['beach','A place by the sea']].map(([w,h],i)=>`<div class="task"><b>${h}</b><input id="ab84${i}" placeholder="Type the word"><button onclick="let ok=$('ab84${i}').value.trim().toLowerCase()==='${w}';feedback('ab84fb${i}',ok,award('ab84'+i,'Correct!'),'Try again.')">Check</button><div id="ab84fb${i}" class="feedback"></div></div>`).join('')}</div></div>`;
 if(book==='Pupils Book'&&pg===85)return `<div class="activity"><h3>🎒 Holiday vocabulary</h3><p>Choose the word for each picture. Options: bag, sea and hill.</p><div class="activity-grid">${[['bag','🧳','bag'],['sea','🌊','sea'],['hill','🏞️','hill']].map(([w,e,h],i)=>`<div class="task" style="text-align:center"><div class="emoji">${e}</div><b>${h}</b><select id="pb85${i}"><option value="">Choose…</option><option>bag</option><option>sea</option><option>hill</option></select></div>`).join('')}</div><button onclick="let ok=['bag','sea','hill'].every((w,i)=>$('pb85'+i).value===w);feedback('pb85fb',ok,award('pb85','Good matching!'),'Check the words again.')">Check</button><div id="pb85fb" class="feedback"></div><h3 style="margin-top:18px">👨‍👩‍👧‍👦 Who is doing what?</h3><p>Match each Star family member with the correct action.</p><div class="activity-grid">${[['Stella','🎤','writing a new song'],['Susie','🐚','getting lots of shells'],['Simon','🏊','swimming in the sea'],['Dad / Mr Star','🚶','walking on the sand'],['Mum / Mrs Star','📖','reading in the sun']].map(([n,e],i)=>`<div class="task"><div class="emoji">${e}</div><b>${n}</b><select id="pb85fam${i}"><option value="">Choose an action…</option>${['reading in the sun','swimming in the sea','writing a new song','walking on the sand','getting lots of shells'].map(x=>`<option>${x}</option>`).join('')}</select></div>`).join('')}</div><button onclick="let a=['writing a new song','getting lots of shells','swimming in the sea','walking on the sand','reading in the sun'];let ok=a.every((w,i)=>$('pb85fam'+i).value===w);feedback('pb85famb',ok,award('pb85fam','All matched!'),'Some actions need another look.')">Check matches</button><div id="pb85famb" class="feedback"></div></div>`;
 if(book==='Activity Book'&&pg===85)return `<div class="activity"><h3>✏️ Write about your holiday</h3><p>Write your own answers.</p><div class="activity-grid">${['Where do you go on holiday?','What do you take?','What do you like doing?'].map((q,i)=>`<div class="task"><label>${q}</label><textarea id="ab85${i}" rows="2" placeholder="Write your answer"></textarea></div>`).join('')}</div><button onclick="let ok=[0,1,2].every(i=>$('ab85'+i).value.trim());feedback('ab85fb',ok,award('ab85','Great writing!'),'Complete all three answers.')">Check writing</button><div id="ab85fb" class="feedback"></div><h3 style="margin-top:18px">🔀 Unscramble the words</h3><div class="activity-grid">${[['sand','dnas'],['beach','hceab'],['shell','llehs'],['sun','nus']].map(([w,m],i)=>`<div class="task"><div class="emoji">${['🏖️','🌊','🐚','☀️'][i]}</div><b>${m.split('').join(' · ')}</b><input id="ab85scr${i}" placeholder="Write the word"><button onclick="let ok=$('ab85scr${i}').value.trim().toLowerCase()==='${w}';feedback('ab85scrfb${i}',ok,award('ab85scr${i}','Correct!'),'Try again.')">Check</button><div id="ab85scrfb${i}" class="feedback"></div></div>`).join('')}</div></div>`;
 if(book==='Pupils Book'&&pg===86)return `<div class="activity"><h3>🗺️ On holiday, I would like to go…</h3><p>Choose a picture. Your sentence appears automatically, and you can change your choice.</p><div class="activity-grid">${[['🏖️','the beach'],['🏔️','the mountains'],['🌲','the forest'],['🏙️','the city'],['🏝️','an island'],['🌊','the sea']].map(([e,w])=>`<button class="task" style="background:white;box-shadow:none;border:3px solid #dce8ff" onclick="this.parentElement.querySelectorAll('button').forEach(x=>x.style.borderColor='#dce8ff');this.style.borderColor='#ff719e';$('pb86sentence').textContent='I would like to go to ${w}.';award('pb86dest','Destination chosen!')"><div class="emoji">${e}</div><b>${w}</b></button>`).join('')}</div><div class="task" style="margin-top:12px;background:#fff5c9;text-align:center"><h3 id="pb86sentence">I would like to go to the beach.</h3></div></div>`;
 if(book==='Activity Book'&&pg===86)return `<div class="activity"><h3>🎁 Birthday wishes</h3><p>Choose the gifts you want and the gifts you don't want for your birthday.</p><div class="activity-grid">${[['🛹','a cool skateboard'],['🤖','a gray robot'],['📷','a small camera'],['🪁','a new kite'],['📏','a long ruler'],['🎂','a chocolate cake']].map(([e,w],i)=>`<div class="task" style="text-align:center"><div class="emoji">${e}</div><b>${w}</b><select id="ab86gift${i}"><option value="">Choose a box…</option><option value="want">I want</option><option value="dont">I don't want</option></select></div>`).join('')}</div><div class="task" style="margin-top:12px"><h3>🎉 My birthday list</h3><div id="ab86result">Choose a category for each gift.</div><button onclick="let items=[['a cool skateboard','🛹'],['a gray robot','🤖'],['a small camera','📷'],['a new kite','🪁'],['a long ruler','📏'],['a chocolate cake','🎂']];let vals=items.map((x,i)=>$('ab86gift'+i).value);if(vals.every(Boolean)){let a=items.filter((x,i)=>vals[i]==='want').map(x=>x[1]+' '+x[0]);let b=items.filter((x,i)=>vals[i]==='dont').map(x=>x[1]+' '+x[0]);$('ab86result').innerHTML='<b>I want:</b> '+(a.join(', ')||'—')+'<br><b>I don\'t want:</b> '+(b.join(', ')||'—');award('ab86birthday','Birthday list complete!')}else $('ab86result').textContent='Choose I want or I don’t want for every gift.'">Show my choices</button></div></div>`;
 if(book==='Pupils Book'&&pg===87)return `<div class="activity"><h3>🔤 Phonics & Magic E</h3><p>Tap the speaker to hear each word. Practise the sound and read the word aloud.</p><h3>✨ Magic E</h3><div class="activity-grid">${[['cap','cape'],['kit','kite'],['hop','hope'],['cub','cube'],['tap','tape'],['pin','pine']].map(([a,b])=>`<div class="task"><b>${a} → ${b}</b><button class="secondary" onclick="speakWord('${a}')">🔊 ${a}</button><button onclick="speakWord('${b}')">🔊 ${b}</button></div>`).join('')}</div><h3 style="margin-top:16px">🎧 Phonics sounds</h3><div class="activity-grid">${[['CH','chair, cheese, chips'],['WH','whale, wheel, white'],['SH','ship, shell, shoes'],['S','sun, sand, sea'],['N','nose, net, nest'],['TH','thumb, three, bath']].map(([a,b])=>`<div class="task"><b style="font-size:24px">${a}</b><p>${b}</p><button onclick="speakWord('${b}')">🔊 Listen</button></div>`).join('')}</div><p class="sub">Pronunciation uses your browser’s built-in speech voice.</p></div>`;
 if(book==='Activity Book'&&pg===87)return `<div class="activity"><h3>🎨 Colour the picture</h3><p>Use the original Activity Book page above and colour it. The extra Spelling Practice task has been removed.</p></div>`;
 if(book==='Pupils Book'&&pg===88)return `<div class="activity"><h3>🔤 Monty’s Sounds and Spelling</h3><p>Watch the phonics video above and practise the sounds.</p><div class="activity-grid">${[['CH','chair','🪑'],['WH','whale','🐋'],['SH','ship','🚢'],['S','sun','☀️'],['N','nose','👃']].map(([a,w,e])=>`<div class="task"><b>${a}</b><div class="emoji">${e}</div><button onclick="speakWord('${w}')">🔊 ${w}</button></div>`).join('')}</div></div>`;
 if(book==='Activity Book'&&pg===88)return `<div class="activity"><h3>🎒 Holiday practice</h3><p>Write a sentence about what you take on holiday.</p><div class="task"><textarea id="ab88" rows="3" placeholder="I take ..."></textarea><button onclick="let ok=$('ab88').value.trim().length>4;feedback('ab88fb',ok,award('ab88','Sentence saved!'),'Write a complete sentence.')">Check</button><div id="ab88fb" class="feedback"></div></div></div>`;
 if(book==='Pupils Book'&&pg===89)return `<div class="activity"><h3>🎬 Trevor’s story: Star Beach</h3><p>Watch the story video above and listen to Tracks 122 and 123. Then answer.</p><div class="task"><label>Where does Trevor want to go?</label><input id="pb89a" placeholder="Write your answer"><button onclick="let ok=$('pb89a').value.trim().toLowerCase().includes('star beach');feedback('pb89afb',ok,award('pb89a','Correct!'),'Try again after watching the story.')">Check</button><div id="pb89afb" class="feedback"></div></div><div class="task"><label>What does Trevor want for his holiday?</label><textarea id="pb89b" rows="2" placeholder="Write your idea"></textarea><button onclick="let ok=$('pb89b').value.trim().length>3;feedback('pb89bfb',ok,award('pb89b','Good answer!'),'Write a little more.')">Check</button><div id="pb89bfb" class="feedback"></div></div></div>`;
 if(book==='Pupils Book'&&pg===90)return `<div class="activity"><h3>🧗 Adventure equipment</h3><p>Match each word to its picture.</p><div class="activity-grid">${[['🗺️','map'],['🪢','rope'],['🔦','torch'],['🤿','air tank'],['⛺','tent'],['🥽','mask'],['🥾','boots'],['🤿','snorkel'],['🧥','wetsuit'],['⛑️','helmet']].map(([e,w],i)=>`<div class="task" style="text-align:center"><div class="emoji">${e}</div><select id="pb90eq${i}"><option value="">Choose a word…</option>${['map','rope','torch','air tank','tent','mask','boots','snorkel','wetsuit','helmet'].map(x=>`<option>${x}</option>`).join('')}</select></div>`).join('')}</div><button onclick="let a=['map','rope','torch','air tank','tent','mask','boots','snorkel','wetsuit','helmet'];let ok=a.every((w,i)=>$('pb90eq'+i).value===w);feedback('pb90eqfb',ok,award('pb90eq','All equipment matched!'),'Check the matches again.')">Check matches</button><div id="pb90eqfb" class="feedback"></div></div>`;
 if(book==='Activity Book'&&pg===90)return `<div class="activity"><h3>🧭 Where do you want to explore?</h3><p>Choose a place and the equipment you need. Make your own adventure sentence.</p><div class="task"><label>Where do you want to explore?</label><div class="chips">${['mountains','forest','sea'].map(w=>`<button class="secondary" onclick="$('ab90place').value='${w}'">${w}</button>`).join('')}</div><input id="ab90place" placeholder="Choose or type: mountains, forest, sea"><label>I need…</label><div class="chips">${['helmet','torch','map','rope','boots','tent','mask','snorkel','wetsuit','air tank'].map(w=>`<button class="secondary" onclick="addEquipment('${w}')">${w}</button>`).join('')}</div><input id="ab90need" placeholder="Choose equipment"><button onclick="let ok=$('ab90place').value.trim()&&$('ab90need').value.trim();feedback('ab90fb',!!ok,award('ab90','Adventure ready!'),'Choose a place and at least one item.')">Build my adventure</button><div id="ab90fb" class="feedback"></div></div><div class="task"><h3 id="ab90sentence">My adventure sentence</h3><button class="secondary" onclick="$('ab90sentence').textContent='I want to explore the '+$('ab90place').value+'. I need '+$('ab90need').value+'.'">Show my sentence</button></div></div>`;

 if(book==='Activity Book'&&pg===91)return `<div class="activity"><h3>🤝 Values reflection</h3><p>Listen to Track 41, then complete the sentence.</p><div class="task"><label>I can help by...</label><textarea id="ab91" rows="3" placeholder="Write your idea"></textarea><button onclick="let ok=$('ab91').value.trim().length>5;feedback('ab91fb',ok,award('ab91','Lovely idea!'),'Complete the sentence.')">Check</button><div id="ab91fb" class="feedback"></div></div></div>`;
 return '';
}
function speakWord(word){if('speechSynthesis' in window){window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(word);u.lang='en-GB';window.speechSynthesis.speak(u)}else alert('Audio pronunciation is not supported in this browser.')}
function addEquipment(word){let el=document.getElementById('ab90need');el.value=el.value.trim()?el.value.trim()+', '+word:word}

render();
</script></body></html>
