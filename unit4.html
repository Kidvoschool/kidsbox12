function pageZoom(btn,delta){

}
function inputCheck(btn,expected,feedbackId){

 const fb=card.querySelector(".feedback");
 if(ok){fb.textContent="Excellent! ⭐";fb.className="feedback good";award("task-"+current+"-"+(feedbackId||"done"))}
 else{fb.textContent="Try again! Check the spelling and order.";fb.className="feedback bad"}
}

 if(vals.join(" ")===correct){fb.textContent="Perfect sentence! ⭐";fb.className="feedback good";award("sentence-"+current+"-"+correct)}
 else{fb.textContent="Try again!";fb.className="feedback bad"}
}

addScreen("Final mission",`<section class="panel"><div class="reward">🏆⭐🏆</div><h1>Well done!</h1><p>You finished the available Unit 4 lesson screens.</p><h2>Your stars: <span id="finalScore">0</span> ⭐</h2><p class="small">You completed the supplied pages 24–32, listened to the tracks and played the extra practice games.</p><button class="btn" onclick="restart()">Play again ↻</button></section>`);


function pickLetter(btn,id){const box=document.getElementById(id);if(!box||btn.disabled)return;box.textContent+=btn.textContent;box.dataset.value=(box.dataset.value||"")+btn.textContent.toLowerCase();btn.disabled=true;btn.classList.add("used")}
function resetLetters(id){const box=document.getElementById(id);if(!box)return;box.textContent="";box.dataset.value="";box.closest(".wordtile").querySelectorAll(".letter-chip").forEach(b=>{b.disabled=false;b.classList.remove("used")})}
function checkLetterWords(btn){const boxes=[...btn.closest(".gamepanel").querySelectorAll(".answer-slots")];const ok=boxes.every(x=>x.dataset.value===x.dataset.answer);const fb=btn.nextElementSibling;if(ok){fb.textContent="All furniture words are correct! ⭐";fb.className="feedback good";award("furniture-spelling")}else{fb.textContent="Some letters are in the wrong order. Try again!";fb.className="feedback bad"}}
function crosswordCheck(btn){const card=btn.closest(".gamepanel");const words=[...card.querySelectorAll(".crossclue input[data-answer]")];const cells=[...card.querySelectorAll("input[data-secret]")];const wordsOK=words.every(x=>x.value.trim().toLowerCase()===x.dataset.answer);const secretOK=cells.every(x=>x.value.trim().toUpperCase()===x.dataset.secret);const fb=btn.nextElementSibling;if(wordsOK&&secretOK){fb.textContent="Crossword complete! Secret word: ARMCHAIR ⭐";fb.className="feedback good";award("crossword-"+current)}else if(!wordsOK){fb.textContent="Check the eight picture words first.";fb.className="feedback bad"}else{fb.textContent="The picture words are correct. Now complete the numbered secret-word boxes.";fb.className="feedback bad"}}
function addSentenceWord(btn){const builder=btn.closest(".sentence-builder");const slots=builder.querySelector(".sentence-slots");if(btn.disabled)return;const chip=document.createElement("button");chip.className="word-chip selected-word";chip.textContent=btn.textContent;chip.type="button";chip.onclick=()=>{btn.disabled=false;slots.removeChild(chip)};slots.appendChild(chip);btn.disabled=true}
function resetSentence(btn){const b=btn.closest(".sentence-builder");b.querySelectorAll(".word-pool .word-chip").forEach(x=>x.disabled=false);b.querySelector(".sentence-slots").innerHTML=""}
function checkBuiltSentences(btn){const builders=[...btn.closest(".gamepanel").querySelectorAll(".sentence-builder")];const ok=builders.every(b=>[...b.querySelectorAll(".sentence-slots .word-chip")].map(x=>x.textContent).join(" ")===b.dataset.answer);const fb=btn.nextElementSibling;if(ok){fb.textContent="Perfect! All sentences are in the right order. ⭐";fb.className="feedback good";award("built-sentences-"+current)}else{fb.textContent="Check the word order. Tap a word in the answer area to return it.";fb.className="feedback bad"}}
function dragBodyPart(ev){ev.dataTransfer.setData("text/bodypart",ev.target.dataset.bodyword)}
function dropBodyPart(ev){ev.preventDefault();const word=ev.dataTransfer.getData("text/bodypart");const target=ev.currentTarget;if(word){target.querySelector(".drop-answer").textContent=word;target.dataset.answer=word;const bank=document.querySelector('.bodywordbank [data-bodyword="'+word+'"]');if(bank)bank.classList.add("placed")}}
function checkBodyParts(btn){const targets=[...btn.closest(".gamepanel").querySelectorAll(".monster-target")];const ok=targets.every(x=>x.dataset.answer===x.dataset.part);const fb=btn.previousElementSibling;if(ok){fb.textContent="Monty is labelled correctly! ⭐";fb.className="feedback good";award("monster-body-"+current)}else{fb.textContent="Some labels are not in the right place yet.";fb.className="feedback bad"}}
function dragReviewWord(ev){ev.dataTransfer.setData("text/review",ev.target.dataset.review)}
function dropReviewWord(ev){ev.preventDefault();const word=ev.dataTransfer.getData("text/review");const el=document.querySelector('.review-word[data-review="'+word+'"]');if(el&&!el.classList.contains("sorted")){ev.currentTarget.querySelector(".sort-words").appendChild(el);el.classList.add("sorted")}}
function checkReviewSort(btn){const words=[...btn.closest(".gamepanel").querySelectorAll(".review-word")];const ok=words.every(w=>w.closest(".sort-target")&&w.closest(".sort-target").dataset.category===w.dataset.category);const fb=btn.nextElementSibling;if(ok){fb.textContent="Fantastic sorting! ⭐";fb.className="feedback good";award("review-units-1-4")}else{fb.textContent="Some words belong in a different category. Try again.";fb.className="feedback bad"}}
function clearDrawing(btn){const c=btn.parentElement.querySelector("canvas");c.getContext("2d").clearRect(0,0,c.width,c.height)}
function setColour(color){window.selectedColour=color;document.querySelectorAll(".colourobject").forEach(el=>el.onclick=()=>{el.style.background=color;el.style.color=(color==="yellow"?"#573e00":"#fff")})}
function checkAllSelect(btn){const box=btn.closest(".gamepanel");const selects=[...box.querySelectorAll("select[data-answer]")];const ok=selects.every(s=>s.value===s.dataset.answer);const fb=btn.nextElementSibling;if(ok){fb.textContent="Brilliant! ⭐";fb.className="feedback good";award("present-"+current)}else{fb.textContent="Check am / is / are.";fb.className="feedback bad"}}
function checkSentenceInputs(btn){const box=btn.closest(".gamepanel");const inputs=[...box.querySelectorAll("input[data-answer]")];const ok=inputs.every(x=>x.value.trim().replace(/[.!?]$/,"").toLowerCase()===x.dataset.answer.toLowerCase().replace(/[.!?]$/,""));const fb=btn.nextElementSibling;if(ok){fb.textContent="All sentences are correct! ⭐";fb.className="feedback good";award("sentences-"+current)}else{fb.textContent="Check the word order and try again.";fb.className="feedback bad"}}
function hunt(btn,word){const fb=$("#huntfeedback");const target=$("#huntTarget").value;if(word===target){fb.textContent="Correct! "+word+" is number "+btn.querySelector("b").textContent+". ⭐";fb.className="feedback good";award("hunt-"+word)}else{fb.textContent="Not this one. Find "+target+"!";fb.className="feedback bad"}}
function render(){
 const root=$("#screens");root.innerHTML="";
 screens.forEach((s,i)=>{let el=document.createElement("section");el.className="screen"+(i===current?" active":"");el.innerHTML=s.content;root.appendChild(el)});
 $("#counter").textContent=`${current+1} / ${screens.length} • ${screens[current].title}`;
 $("#bar").style.width=((current+1)/screens.length*100)+"%";
 $("#back").disabled=current===0;$("#back").style.opacity=current===0?".45":"1";
 $("#next").textContent=current===screens.length-1?"Finish ✓":"Next →";
 if(current===screens.length-1)$("#finalScore").textContent=score;
 document.querySelectorAll(".drawcanvas").forEach(c=>{if(c.dataset.ready)return;c.dataset.ready="1";let drawing=false,ctx=c.getContext("2d");ctx.lineWidth=5;ctx.lineCap="round";ctx.strokeStyle="#174b86";function pos(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]}c.addEventListener("pointerdown",e=>{drawing=true;let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y);c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(!drawing)return;let [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()});c.addEventListener("pointerup",()=>drawing=false);c.addEventListener("pointercancel",()=>drawing=false)});
}
function next(){if(current<screens.length-1){current++;render();window.scrollTo(0,0)}}
function prev(){if(current>0){current--;render();window.scrollTo(0,0)}}
function choose(btn,val,correct){
 const box=btn.closest(".quiz");box.querySelectorAll(".answer").forEach(b=>b.classList.remove("selected","correct","wrong"));
 const fb=box.querySelector(".feedback");
 if(val===correct){btn.classList.add("correct");fb.textContent="Correct! ⭐";fb.className="feedback good";const key=current+"-"+correct;if(!earned.has(key)){earned.add(key);score++;$("#score").textContent=score}}
 else{btn.classList.add("wrong");fb.textContent="Try again!";fb.className="feedback bad"}
}
function checkText(){let v=$("#spelling").value.trim().toLowerCase(),f=$("#textFeedback");if(v==="hers"){f.textContent="Correct! ⭐";f.className="feedback good";if(!earned.has("hers")){earned.add("hers");score++;$("#score").textContent=score}}else{f.textContent="Try again!";f.className="feedback bad"}}
let currentAudio=null,currentAudioBtn=null;
function playAudio(name,btn){if(currentAudio&&currentAudioBtn===btn&&!currentAudio.paused){currentAudio.pause();btn.textContent=btn.textContent.replace("⏸ Pause","▶");btn.classList.remove("playing");return}
 if(currentAudio){currentAudio.pause();if(currentAudioBtn){currentAudioBtn.classList.remove("playing");currentAudioBtn.textContent=currentAudioBtn.textContent.replace("⏸ Pause","▶")}}
 currentAudio=new Audio(AUDIOS[name]);currentAudioBtn=btn;btn.classList.add("playing");btn.textContent=btn.textContent.replace("▶","⏸ Pause");currentAudio.play().catch(()=>{});currentAudio.onended=()=>{btn.classList.remove("playing");btn.textContent=btn.textContent.replace("⏸ Pause","▶")}}
function openVideo(name){const v=VIDEOS[name];if(!v)return;let el=$("#modalVideo");el.src=v;$("#modal").classList.add("open");el.play().catch(()=>{})}
function closeVideo(){let el=$("#modalVideo");el.pause();el.removeAttribute("src");el.load();$("#modal").classList.remove("open")}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeVideo()}});
function restart(){current=0;score=0;earned.clear();$("#score").textContent=0;render();window.scrollTo(0,0)}
render();
</script></body></html>
