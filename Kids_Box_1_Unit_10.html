<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kids Box 1 · Unit 10 · At the funfair!</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#263d60}*{box-sizing:border-box}body{margin:0;background:linear-gradient(125deg,#e0faff,#fff0fa);min-height:100vh}header{position:sticky;top:0;z-index:5;background:#ffffffef;display:flex;gap:18px;align-items:center;padding:12px 3vw;box-shadow:0 2px 10px #81c5df44;font-weight:900}.brand{color:#ef3690;white-space:nowrap}.track{flex:1;border-radius:50px;background:#e0eaf5;height:14px;overflow:hidden}.progress{height:100%;background:linear-gradient(90deg,#1bd5b9,#548dfe);transition:width .2s}main{max-width:1600px;margin:0 auto;padding:25px 3vw}.pill{display:inline-block;border-radius:20px;padding:9px 16px;background:white;color:#9652de;font-weight:850}.title{font-size:clamp(30px,3.6vw,52px);margin:12px 0 21px}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(285px,345px);gap:22px;align-items:start}.picture,.panel{background:#fff;border:4px solid #d1efff;border-radius:36px;padding:22px;box-shadow:0 16px 40px #2a668212}.picture img{display:block;width:100%;height:auto;border-radius:20px}.panel{margin-bottom:15px;padding:23px}.panel h2{margin:0 0 12px;font-size:23px}.muted{color:#55718c;line-height:1.55}.btn,.option{cursor:pointer;border:0;border-radius:17px;padding:13px 18px;font-size:16px;font-weight:850}.btn{color:white;background:linear-gradient(#65c9ff,#238be8);box-shadow:0 5px #1b62b9}.btn.pink{background:linear-gradient(#fd83c8,#ed3490);box-shadow:0 5px #b41b70}.btn.green{background:linear-gradient(#69e9bb,#19b98d);box-shadow:0 5px #158365}.btn.light{background:#f3fbff;border:2px solid #cae9fa;box-shadow:none;color:#345775}.btn:disabled{opacity:.45;cursor:default}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.activity{border-radius:22px;background:#ecfaff;border:2px solid #c7eaff;padding:16px;margin-top:13px}.activity strong{font-size:20px}.option{margin:7px 7px 0 0;background:#fff;color:#244060;border:2px solid #8ddcff}.option.selected{background:#bdf3df;border-color:#2bb981}.option.wrong{background:#ffe4ec;border-color:#f97b92}.feedback{min-height:28px;font-weight:800;color:#07875c;margin-top:12px}.nav{display:flex;justify-content:space-between;margin-top:22px;align-items:center}.modal{position:fixed;inset:0;background:#132846b9;display:none;align-items:center;justify-content:center;z-index:20;padding:20px}.modal.open{display:flex}.dialog{background:white;width:min(950px,96vw);padding:22px;border-radius:28px;box-shadow:0 10px 50px #101e3a90}.dialog header{position:static;box-shadow:none;padding:0 0 15px}.dialog video{width:100%;max-height:70vh;background:black;border-radius:15px}.audioPop{width:min(600px,96vw)}iframe{width:100%;height:180px;border:0;border-radius:15px}.note{font-size:13px;color:#607990;margin-top:10px}.star{font-size:62px}.finish{max-width:900px;margin:55px auto;background:white;border:4px solid #cfebff;border-radius:40px;padding:55px 35px;text-align:center;box-shadow:0 20px 60px #33799e1c}.finish h1{font-size:clamp(32px,5vw,65px);color:#2385ce}.smallprint{color:#607792;font-size:13px}@media(max-width:900px){.layout{grid-template-columns:1fr}.panel{padding:18px}.picture{padding:12px}.brand{font-size:13px}main{padding:18px 3vw}}
</style></head><body><header><span class="brand">🎡 KIDS BOX · UNIT 10</span><div class="track"><div class="progress" id="progress"></div></div><span id="counter"></span></header><main id="root"></main><div class="modal" id="modal" role="dialog" aria-modal="true"><div class="dialog" id="dialog"></div></div><script>const DATA={"steps": [{"page": 70, "title": "Transport at the funfair", "sub": "Listen and point · Listen and repeat", "aud": [113, 114], "vid": [], "tip": "Say the words aloud. Then answer: Is the lorry blue?", "type": "transport", "q": "Which one can fly in the sky?", "options": ["boat", "plane", "lorry"], "answer": "plane"}, {"page": 71, "title": "Chant and find", "sub": "Listen and say the chant · Listen and answer", "aud": [115, 116], "vid": [], "tip": "Point to each vehicle as you hear it. Say its colour!", "type": "transport", "q": "Which vehicle travels on railway tracks?", "options": ["train", "bus", "ship"], "answer": "train"}, {"page": 72, "title": "What are you doing?", "sub": "Listen and point · Listen and repeat", "aud": [117, 118], "vid": ["Language"], "tip": "Practise: “What are you doing?” — “I’m flying my plane.”", "type": "choice", "q": "Which sentence describes Maskman?", "options": ["I’m flying my plane.", "I’m riding a bike.", "I’m swimming."], "answer": "I’m flying my plane."}, {"page": 73, "title": "Sing and move", "sub": "Listen and sing · Do karaoke", "aud": [119, 120], "vid": ["Song", "Karaoke"], "tip": "Sing the song, then try karaoke. Act out driving, riding and flying.", "type": "choice", "q": "Complete the sentence: “I’m ___ on my motorbike.”", "options": ["riding", "flying", "swimming"], "answer": "riding"}, {"page": 74, "title": "Monty’s sounds and spelling", "sub": "Watch and say · Practise the sound -ng", "aud": [121], "vid": ["Montys_sounds_and_spelling"], "tip": "Listen for “-ng” in singing, swinging, jumping and clapping.", "type": "choice", "q": "Which word ends with the sound -ng?", "options": ["singing", "boat", "plane"], "answer": "singing"}, {"page": 75, "title": "The funfair story", "sub": "Watch the story · Listen and say the number", "aud": [122, 123], "vid": ["Story"], "tip": "Watch the story, put the scenes in order and act out your favourite scene.", "type": "choice", "q": "Which vehicle helps Maskman in the sea?", "options": ["helicopter", "train", "motorbike"], "answer": "helicopter"}], "tracks": {"113": "1Gn177yKvUuj96tAW4BE49qDTCGJi-A0x", "114": "1rp0J1mFQOZY9c0QQjzzXPkqopUtkBbro", "115": "1cgy-8o1vA7rRLWKQ8UxSFeJ5UZh4Fwv3", "116": "1y97lm3P1y1KHxjtdz92nv8wTVKS8cVwP", "117": "1KOPncmaiL2--7Vg1Rac2Jfh2XrgE2Ic2", "118": "1wBnf2Deh9Rv3dwfeJEsBnZgC0jOQKeGn", "119": "1F7EeDr25QQ4YHBYYlO4LlE2gE-VDjKy5", "120": "1003gUAz79I4BhNbwKvVwjfEeH-cdmkY5", "121": "1FGk2Wm05z3gAIqtI3reEiqPo0pljLrld", "122": "1qgfa25c_9fhg39HNyKnzAxUWLzO8xXTg", "123": "1TwRJ05Wc76gdzXvHgmCvyr5MfMEuWln8"}, "images": ["media/kb1-unit10/img01.jpg", "media/kb1-unit10/img02.jpg", "media/kb1-unit10/img03.jpg", "media/kb1-unit10/img04.jpg", "media/kb1-unit10/img05.jpg", "media/kb1-unit10/img06.jpg"], "videos": {"Language": "media/kb1-unit10/video01.mp4", "Song": "media/kb1-unit10/video02.mp4", "Karaoke": "media/kb1-unit10/video03.mp4", "Montys_sounds_and_spelling": "media/kb1-unit10/video04.mp4", "Story": "media/kb1-unit10/video05.mp4"}};
let step=0,stars=0,completed=new Set(),quizIndex={},videoElement=null;
const el=x=>document.getElementById(x);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setStep(n){step=n;render();window.scrollTo({top:0,behavior:'smooth'})}
function closeModal(){if(videoElement){videoElement.pause();videoElement.src='';videoElement=null;}el('modal').classList.remove('open');el('dialog').innerHTML=''}
function showVideo(kind){let div=el('dialog');div.innerHTML=`<header><h2 style="flex:1;margin:0">🎬 ${kind.replaceAll('_',' ')}</h2><button class="btn light" onclick="closeModal()">Close ✕</button></header><video id="videoPlayer" controls playsinline preload="metadata"></video>`;el('modal').classList.add('open');videoElement=el('videoPlayer');videoElement.src=DATA.videos[kind];videoElement.load();videoElement.play().catch(()=>{});}
function showAudio(n){let id=DATA.tracks[n];el('dialog').innerHTML=`<header><h2 style="flex:1;margin:0">🎧 Track ${n}</h2><button class="btn light" onclick="closeModal()">Close ✕</button></header><div class="audioPop"><iframe allow="autoplay" src="https://drive.google.com/file/d/${id}/preview" title="Original audio track ${n}"></iframe><p class="note">Original audio on Google Drive. Internet and access to the shared folder are required.</p><a target="_blank" rel="noopener" href="https://drive.google.com/file/d/${id}/view">Open audio in Google Drive ↗</a></div>`;el('modal').classList.add('open')}
function selectAnswer(ans){let q=DATA.steps[step];let ok=ans===q.answer;el('feedback').textContent=ok?'🌟 Brilliant! That’s correct!':'Try again! Look carefully at the picture.';document.querySelectorAll('.option').forEach(b=>{b.classList.toggle('selected',b.dataset.answer===ans&&ok);b.classList.toggle('wrong',b.dataset.answer===ans&&!ok)});if(ok&&!completed.has(step)){completed.add(step);stars++;el('starcount').textContent=`⭐ ${stars} / 6 stars`}}
function render(){el('progress').style.width=`${Math.min(100,(step+1)/7*100)}%`;el('counter').textContent=step===6?'Finish':`${step+1} / 6`;
if(step===6){el('root').innerHTML=`<div class="finish"><div class="star">🏆🎡✨</div><h1>Fantastic! Unit 10 completed!</h1><p style="font-size:25px">You explored the funfair, sang songs and learnt about transport!</p><h2>⭐ ${stars} / 6 stars</h2><p class="muted">Great work! You’re a funfair champion!</p><div class="buttons" style="justify-content:center"><button class="btn" onclick="setStep(0)">↻ Start lesson again</button><button class="btn pink" onclick="setStep(5)">🎬 Replay the story</button></div></div>`;return}
let x=DATA.steps[step];el('root').innerHTML=`<span class="pill">✨ At the Funfair · Interactive lesson</span><h1 class="title">Page ${x.page} · ${esc(x.title)}</h1><div class="layout"><section class="picture"><img src="${DATA.images[step]}" alt="Original Kids Box Unit 10 page ${x.page}"><div class="note">Original pupil’s book picture · Follow the numbered tasks in the picture.</div></section><aside><div class="panel"><h2>✨ Let’s learn!</h2><p class="muted">${esc(x.sub)}</p><div class="buttons">${x.aud.map(n=>`<button class="btn" onclick="showAudio(${n})">▶ Track ${n}</button>`).join('')}</div>${x.vid.length?`<div class="buttons">${x.vid.map(k=>`<button class="btn pink" onclick="showVideo('${k}')">▶ ${k.replaceAll('_',' ')}</button>`).join('')}</div>`:''}<p class="muted">${esc(x.tip)}</p></div><div class="panel"><h2>⭐ Let’s play!</h2><div class="activity"><strong>${esc(x.q)}</strong><div class="buttons">${x.options.map(v=>`<button class="option" data-answer="${esc(v)}" onclick="selectAnswer(this.dataset.answer)">${esc(v)}</button>`).join('')}</div><div id="feedback" class="feedback">Choose an answer!</div></div><p id="starcount" style="color:#b37b06;font-weight:900">⭐ ${stars} / 6 stars</p></div></aside></div><div class="nav"><button class="btn light" ${step===0?'disabled':''} onclick="setStep(${step-1})">← Back</button><span class="muted">Read · Listen · Speak · Play</span><button class="btn" onclick="setStep(${step+1})">${step===5?'Finish lesson 🏆':'Next →'}</button></div>`}
el('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();</script></body></html>
